name: Platform image (release-official)

# Builds the Oria platform container on GitHub-hosted runners and publishes it to
# GitHub Container Registry. Deployment to Azure Container Apps is a separate,
# manual step (see platform/README.md).

on:
  push:
    branches: ["release-official"]
    paths:
      - "platform/**"
      - ".github/workflows/platform-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  image:
    name: Build and push image
    needs: verify
    if: github.ref == 'refs/heads/release-official'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oria-platform"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_SHA::7},${image}:release-official" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: platform
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
